<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>סולמות קליסטניקס וטבעות</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#1E6B78">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one track → one ladder → a vertical rail of step cards; one card open at a time */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#18211F; --muted:#5B6866; --line:#D3DCDA;
  --accent:#1E6B78; --accent-soft:#D6E8EA; --chalk:#F7F9F9;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121817; --surface:#1B2321; --ink:#E7EEEC; --muted:#9AA8A5; --line:#2E3A38;
  --accent:#6FB8C4; --accent-soft:#1F3639; --chalk:#18201E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1B2321; --ink:#E7EEEC; --muted:#9AA8A5; --line:#2E3A38;
  --accent:#6FB8C4; --accent-soft:#1F3639; --chalk:#18201E; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 18px}
.label{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 0 8px}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
@media (max-width:480px){.tracks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-bottom:20px;border:1.5px solid var(--line);border-radius:12px;padding:4px;background:var(--surface)}
.cat{font:inherit;font-family:var(--display);font-size:1.1rem;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.track{font:inherit;font-weight:700;font-size:1rem;padding:12px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.track small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.track[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.track[aria-pressed="true"] small{color:var(--surface);opacity:.85}
.ladders{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.lad{font:inherit;font-size:.95rem;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.lad[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ladhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.ladhead h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0}
.ladhead span{color:var(--muted);font-size:.9rem}
.rail{list-style:none;margin:0;padding:0;display:grid;gap:10px;position:relative}
.rail::before{content:"";position:absolute;top:24px;bottom:24px;inset-inline-start:23px;width:2px;background:var(--line)}
.step{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:start}
.num{width:48px;height:48px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:1.2rem;position:relative;z-index:1;font-variant-numeric:tabular-nums;color:var(--ink);padding:0;cursor:pointer}
.step.open .num{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;min-width:0;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.card *{-webkit-user-select:text;user-select:text}
.step.open .card{border-color:var(--accent)}
.head{all:unset;box-sizing:border-box;display:block;width:100%;padding:12px 14px;cursor:pointer}
.head:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-weight:700;font-size:1.05rem;direction:ltr;text-align:right;unicode-bidi:plaintext;min-width:0}
.lvl{flex:none;display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.dots{display:flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.one{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.step.open .one{display:none}
.body{padding:0 14px 14px;display:grid;gap:12px}
.td{background:var(--chalk);border-radius:10px;overflow:hidden}
.tdcv{display:block;width:100%;touch-action:pan-y;cursor:grab}
.tdbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;font-size:.85rem;color:var(--muted)}
.tdplay{font:inherit;font-size:.85rem;padding:4px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.ill{background:var(--chalk);border-radius:10px;padding:10px 8px 6px}
.ill svg{display:block;width:100%;max-width:300px;max-height:190px;height:auto;margin:0 auto}
.ill .fg{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.ill .hd{fill:var(--ink)}
.ill .fg2{fill:none;stroke:var(--muted);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.ill .wl{stroke:var(--muted);stroke-width:3}
.ill .st{stroke:var(--muted);stroke-width:2}
.ill .rg{fill:none;stroke:var(--muted);stroke-width:3}
.ill .gr{stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
.ill .eqf{fill:var(--muted);opacity:.35}
.ill .br{stroke:var(--muted);stroke-width:5;stroke-linecap:round}
.ill .eqb{fill:none;stroke:var(--muted);stroke-width:2}
.ill .bd{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round}
.ill .wt{fill:none;stroke:var(--accent);stroke-width:4}
.ill .ar{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ill .lb{fill:var(--muted);font-family:var(--body);font-size:13px}
.how{margin:0;font-size:1rem}
.box{background:var(--chalk);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.box b{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.box.pass{background:var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.grid2{grid-template-columns:minmax(0,1fr)}}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.nav .mv{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.nav .mv:disabled{opacity:.35;cursor:default}
.nav a{color:var(--accent);font-weight:700;text-decoration:none}
.nav a:hover{text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>

<div class="wrap" dir="rtl">
  <h1>סולמות קליסטניקס וטבעות</h1>
  <p class="sub">בוחרים קטגוריה, מסלול וסולם, ולוחצים על שלב כדי לראות את הפרטים.</p>

  <div class="cats" id="cats"></div>

  <p class="label">מסלול</p>
  <div class="tracks" id="tracks"></div>

  <p class="label">סולם</p>
  <div class="ladders" id="ladders"></div>

  <div class="ladhead"><h2 id="ladname"></h2><span id="ladcount"></span></div>
  <ol class="rail" id="rail"></ol>
</div>

<script>
// ===== Simple figure illustrations =====
// Side view: angles in degrees, 0 = right, 90 = down, -90 = up. Ground at y = 200.
// Front view: used for hanging/pulling on a bar or rings.
const ILLV = (()=>{
const GY=200;
const f=n=>Math.round(n*10)/10;
const add=(p,len,a)=>{a=a*Math.PI/180;return [p[0]+Math.cos(a)*len,p[1]+Math.sin(a)*len]};
const line=(pts,cls)=>`<polyline class="${cls}" points="${pts.map(q=>f(q[0])+","+f(q[1])).join(" ")}"/>`;
const ang=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;

// two-link IK. pref: [x,y] direction the middle joint should bend toward
function ik(a0,b0,la,lb,pref){
  const dx=b0[0]-a0[0], dy=b0[1]-a0[1], d=Math.hypot(dx,dy)||0.001;
  if(d>=la+lb-0.3){const ux=dx/d,uy=dy/d;return [[a0[0]+ux*la,a0[1]+uy*la],[a0[0]+ux*(la+lb),a0[1]+uy*(la+lb)]];}
  const ux=dx/d, uy=dy/d, along=(la*la-lb*lb+d*d)/(2*d), h=Math.sqrt(Math.max(0,la*la-along*along));
  const m=[a0[0]+ux*along,a0[1]+uy*along];
  const c1=[m[0]-uy*h,m[1]+ux*h], c2=[m[0]+uy*h,m[1]-ux*h];
  const s1=(c1[0]-m[0])*pref[0]+(c1[1]-m[1])*pref[1];
  return [s1>=0?c1:c2, b0];
}
// ---------- side view ----------
function sideJ(p){
  const H=p.H, t=p.t, S=add(H,50,t);
  const C=add(add(S,15,t),4*(p.face||1),t+90);
  const arm=(A,ua,fa,pref)=>{
    if(A) return ik(S,A,28,26,pref||[-1,0]);
    const E=add(S,28,ua); return [E,add(E,26,fa)];
  };
  const leg=(L,th,sh,pref)=>{
    if(L) return ik(H,L,37,36,pref||[1,0]);
    const K=add(H,37,th); return [K,add(K,36,sh)];
  };
  const J={H,S,C};
  [J.E,J.W]=arm(p.A,p.ua,p.fa,p.eb);
  [J.K,J.F]=leg(p.L,p.th,p.sh,p.kb);
  if(p.A2||p.ua2!=null) [J.E2,J.W2]=arm(p.A2,p.ua2,p.fa2,p.eb2||p.eb);
  if(p.L2||p.th2!=null) [J.K2,J.F2]=leg(p.L2,p.th2,p.sh2,p.kb2||p.kb);
  return J;
}
function pt(J,r){return typeof r==="string"?J[r]:r}
function props(list,J,out,pts){
  for(const q of list||[]){
    if(q.k==="bar"){const b=pt(J,q.at);out.back+=`<circle class="eq" cx="${f(b[0])}" cy="${f(b[1])}" r="5.5"/>`;pts.push(b);}
    else if(q.k==="hbar"){out.back+=`<line class="br" x1="${f(q.x1)}" y1="${f(q.y)}" x2="${f(q.x2)}" y2="${f(q.y)}"/>`;pts.push([q.x1,q.y],[q.x2,q.y]);}
    else if(q.k==="box"){const y=q.y, h=(q.h!=null?q.h:GY+3.5-y);out.back+=`<rect class="eqb" x="${f(q.x)}" y="${f(y)}" width="${f(q.w)}" height="${f(h)}" rx="3"/>`;pts.push([q.x,y],[q.x+q.w,y+h]);}
    else if(q.k==="wall"){out.back+=`<line class="wl" x1="${f(q.x)}" y1="${f(q.y1)}" x2="${f(q.x)}" y2="${GY+3.5}"/>`;pts.push([q.x,q.y1],[q.x,GY]);}
    else if(q.k==="pole"){out.back+=`<line class="br" x1="${f(q.x)}" y1="${f(q.y1)}" x2="${f(q.x)}" y2="${f(q.y2)}"/>`;pts.push([q.x,q.y1],[q.x,q.y2]);}
    else if(q.k==="ring"){const r=pt(J,q.at), top=r[1]-(q.len||55);
      out.back+=`<line class="st" x1="${f(r[0])}" y1="${f(top)}" x2="${f(r[0])}" y2="${f(r[1]-6)}"/>`;
      out.front+=`<circle class="rg" cx="${f(r[0])}" cy="${f(r[1])}" r="6"/>`;pts.push([r[0],top],r);}
    else if(q.k==="pad"){const a=pt(J,q.at);out.back+=`<rect class="eqf" x="${f(a[0]-9)}" y="${f(a[1]+3)}" width="18" height="${f(GY+3.5-a[1]-3)}" rx="2"/>`;pts.push([a[0]-9,a[1]]);}
    else if(q.k==="band"){const a=pt(J,q.from), b=pt(J,q.to), c=q.via?pt(J,q.via):null;
      out.front+=c?`<path class="bd" d="M${f(a[0])},${f(a[1])} Q${f(c[0])},${f(c[1]+14)} ${f(b[0])},${f(b[1])}"/>`
                  :`<line class="bd" x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}"/>`;pts.push(a,b);}
    else if(q.k==="wt"){const a=pt(J,q.at);out.front+=`<circle class="wt" cx="${f(a[0]+(q.dx||0))}" cy="${f(a[1]+(q.dy||0))}" r="9"/>`;pts.push([a[0]+(q.dx||0),a[1]+(q.dy||0)+9]);}
    else if(q.k==="mark"){const a=pt(J,q.at),d=q.dir||90,s=add(a,-16,d),e=add(a,-4,d),l=add(e,-6,d-35),r=add(e,-6,d+35);
      out.front+=`<path class="ar" d="M${f(s[0])},${f(s[1])} L${f(e[0])},${f(e[1])} M${f(l[0])},${f(l[1])} L${f(e[0])},${f(e[1])} L${f(r[0])},${f(r[1])}"/>`;}
  }
}
function sideFrame(fr){
  const J=sideJ(fr), out={back:"",body:"",front:""}, pts=[];
  props(fr.pr,J,out,pts);
  if(J.W2) out.body+=line([J.S,J.E2,J.W2],"fg2");
  if(J.F2) out.body+=line([J.H,J.K2,J.F2],"fg2");
  out.body+=line([J.H,J.K,J.F],"fg")+line([J.H,J.S],"fg")+line([J.S,J.E,J.W],"fg")
    +`<circle class="hd" cx="${f(J.C[0])}" cy="${f(J.C[1])}" r="10"/>`;
  if(fr.toe){const a=J.F;out.body+=line([a,[a[0]+9,GY]],"fg");}
  for(const k in J) pts.push(J[k]);
  pts.push([J.C[0]-10,J.C[1]-10],[J.C[0]+10,J.C[1]+10]);
  return {svg:out.back+out.body+out.front,pts,ground:!!fr.g};
}
// ---------- front view ----------
function ik2(s,h,down,cx){
  const pref = down ? [0,1] : [s[0]<cx?-1:1, 0];
  return ik(s,h,28,26,pref)[0];
}
function frontFrame(fr){
  const by=90, sy=fr.sy, bx=fr.dx||0, grip=fr.grip||30, pts=[], out={back:"",body:"",front:""};
  const sL=[bx-14,by+sy], sR=[bx+14,by+sy];
  const hL=fr.hL||[-grip,by], hR=fr.hR||[grip,by];
  const eL=(fr.stL||fr.straight)?null:ik2(sL,hL,fr.dnL!=null?fr.dnL:fr.down,bx);
  const eR=(fr.stR||fr.straight)?null:ik2(sR,hR,fr.dnR!=null?fr.dnR:fr.down,bx);
  const neck=[bx,by+sy-4], head=[bx+(fr.hx||0),by+sy-17];
  const pL=[bx-9,by+sy+50], pR=[bx+9,by+sy+50], waist=[bx,by+sy+44];
  let kL,kR,fL,fR;
  if(fr.legs==="box"){kL=[bx-11,pL[1]+28];kR=[bx+11,pR[1]+28];fL=[bx-10,kL[1]+22];fR=[bx+10,kR[1]+22];}
  else if(fr.legs==="tuck"){kL=[bx-12,pL[1]-6];kR=[bx+12,pR[1]-6];fL=[bx-9,pL[1]+14];fR=[bx+9,pR[1]+14];}
  else if(fr.legs==="wide"){kL=[bx-24,pL[1]+33];kR=[bx+24,pR[1]+33];fL=[bx-40,kL[1]+32];fR=[bx+40,kR[1]+32];}
  else {kL=[bx-9,pL[1]+37];kR=[bx+9,pR[1]+37];fL=[bx-8,kL[1]+36];fR=[bx+8,kR[1]+36];}
  const eq=fr.eq||"bar";
  if(eq==="bar"){const x1=Math.min(-58,hL[0]-12), x2=Math.max(58,hR[0]+12);
    out.back+=`<line class="br" x1="${x1}" y1="${by}" x2="${x2}" y2="${by}"/>`;pts.push([x1,by],[x2,by]);}
  else { for(const h of [hL,hR]) if(!fr.freeR||h!==hR){const top=Math.min(by,h[1])-60;
      out.back+=`<line class="st" x1="${f(h[0])}" y1="${f(top)}" x2="${f(h[0])}" y2="${f(h[1]-6)}"/>`;
      out.front+=`<circle class="rg" cx="${f(h[0])}" cy="${f(h[1])}" r="6"/>`;pts.push([h[0],top]);}}
  if(fr.towel){out.front+=`<line class="bd" x1="${f(hR[0])}" y1="${by}" x2="${f(hR[0])}" y2="${f(hR[1]+6)}"/>`;}
  if(fr.box){const y=Math.max(fL[1],fR[1])+4;out.back+=`<rect class="eqb" x="${bx-26}" y="${f(y)}" width="52" height="26" rx="3"/>`;pts.push([bx,y+26]);}
  if(fr.band){const y=Math.max(fL[1],fR[1])+5;
    out.front+=`<path class="bd" d="M${bx-6},${by} L${bx-12},${f(y)} Q${bx},${f(y+8)} ${bx+12},${f(y)} L${bx+6},${by}"/>`;pts.push([bx,y+8]);}
  if(fr.w){out.front+=`<circle class="wt" cx="${bx}" cy="${f(pL[1]+14)}" r="10"/>`;pts.push([bx,pL[1]+24]);}
  const arm=(s,e,h)=>line(e?[s,e,h]:[s,h],"fg");
  out.body+=line([sL,sR],"fg")+line([neck,waist],"fg")+line([waist,pL],"fg")+line([waist,pR],"fg")
    +arm(sL,eL,hL)+arm(sR,eR,hR)+line([pL,kL,fL],"fg")+line([pR,kR,fR],"fg")
    +`<circle class="hd" cx="${f(head[0])}" cy="${f(head[1])}" r="10"/>`;
  if(fr.mark){for(const s of [sL,sR]){const x=s[0]+(s[0]<bx?-9:9),y=s[1]-14;
    out.front+=`<path class="ar" d="M${x},${y} V${y+12} M${x-4},${y+8} L${x},${y+12} L${x+4},${y+8}"/>`;}}
  pts.push([head[0],head[1]-11],fL,fR,hL,hR,sL,sR,pL,pR,kL,kR);
  if(eL) pts.push(eL); if(eR) pts.push(eR);
  return {svg:out.back+out.body+out.front,pts,ground:false};
}
// ---------- layout ----------
const DEF={1:["החזקה"],2:["התחלה","סיום"],3:["התחלה","מעבר","סיום"]};
function draw(frames){
  const parts=frames.map(fr=>fr.v==="front"?frontFrame(fr):sideFrame(fr));
  const n=parts.length, GAP=30;
  const bb=parts.map((p,i)=>{const xs=p.pts.map(q=>q[0]);let a=Math.min(...xs)-6,z=Math.max(...xs)+6;
    const lw=((frames[i].label||DEF[n][i]).length*6.6)+6;
    if(z-a<lw){const c=(a+z)/2;a=c-lw/2;z=c+lw/2;}return [a,z]});
  const ys=parts.flatMap(p=>p.pts.map(q=>q[1]));
  const anyG=parts.some(p=>p.ground);
  let minY=Math.min(...ys)-8, maxY=Math.max(...ys,anyG?GY+4:-1e9)+8;
  // place frames right-to-left
  const offs=[]; let x=0;
  for(let i=n-1;i>=0;i--){offs[i]=x-bb[i][0]; x+= (bb[i][1]-bb[i][0]) + (i>0?GAP:0);}
  const totalW=x;
  let s="";
  parts.forEach((p,i)=>{
    const o=offs[i], cx=o+(bb[i][0]+bb[i][1])/2;
    s+=`<g transform="translate(${f(o)},0)">`;

function rowPair(base,len,legLen,R0,opt){opt=opt||{};let R=R0;
  const best=(d,near)=>{let bA=-150,bS=1e9;for(let a=-179;a<=-91;a+=0.5){const S=add(base,len,a);
      const e=Math.abs(Math.hypot(S[0]-R[0],S[1]-R[1])-d);
      const score=near==null? e*4 - S[1]*0.05 : e*4 + Math.abs(a-near)*0.6;
      if(score<bS){bS=score;bA=a;}}return bA;};
  // finish (like a real ring row): ring/bar just in front of the upper chest, elbow bent behind the body, forearm up to the ring
  // upper arm goes back-and-down behind the body, forearm comes forward-up to the ring in front of the chest
  const UA=a=>a+210, FA=a=>a+80;
  const handAt=a=>{const S=add(base,len,a),E=add(S,28,UA(a));return add(E,26,FA(a));};
  const chestA=()=>{let bA=-150,bE=1e9;for(let a=-179;a<=-91;a+=0.5){
      const w=handAt(a),e=Math.hypot(w[0]-R[0],w[1]-R[1]);if(e<bE){bE=e;bA=a;}}return bA;};
  const fr=(a,end)=>{const H=add(base,legLen,a);
    const o=end?{H,t:a,ua:UA(a),fa:FA(a),g:1,pr:[...(opt.pr||[])]}:{H,t:a,A:R,eb:[0,1],g:1,pr:[...(opt.pr||[])]};
    if(legLen===73) o.L=base; else {o.th=Math.atan2(base[1]-H[1],base[0]-H[0])*180/Math.PI;o.sh=90;}
    if(opt.ring) o.pr.push(ring("W",60)); else o.pr.push(bar(end?"W":R));
    return X(o,opt.extra);};
  const aF=chestA(); R=handAt(aF);            // the bar sits exactly where the hand is at the finish
  const a0=best(54);return [fr(a0),fr(aF,true)];
}

  const sL=[bx-14,by+sy], sR=[bx+14,by+sy], hL=fr.hL||[-grip,by], hR=fr.hR||[grip,by];
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const eL=(fr.stL||fr.straight)?mid(sL,hL):ik2(sL,hL,fr.dnL!=null?fr.dnL:fr.down,bx);
  const eR=(fr.stR||fr.straight)?mid(sR,hR):ik2(sR,hR,fr.dnR!=null?fr.dnR:fr.down,bx);
  const pL=[bx-9,by+sy+50], pR=[bx+9,by+sy+50];
  let kL,kR,fL,fR;
  if(fr.legs==="box"){kL=[bx-11,pL[1]+28];kR=[bx+11,pR[1]+28];fL=[bx-10,kL[1]+22];fR=[bx+10,kR[1]+22];}
  else if(fr.legs==="tuck"){kL=[bx-12,pL[1]-6];kR=[bx+12,pR[1]-6];fL=[bx-9,pL[1]+14];fR=[bx+9,pR[1]+14];}
  else {kL=[bx-9,pL[1]+37];kR=[bx+9,pR[1]+37];fL=[bx-8,kL[1]+36];fR=[bx+8,kR[1]+36];}
  return {sL,sR,eL,eR,hL,hR,pL,pR,kL,kR,fL,fR,neck:[bx,by+sy-4],head:[bx,by+sy-17],by,eq:fr.eq||"bar",box:!!fr.box,band:!!fr.band,w:!!fr.w,towel:!!fr.towel};
}
function frames3d(ex,r){
  if(RAW3D[ex]) return RAW3D[ex];
  return (pick(ex,r)||[]).map(fr=>{
    if(fr.v==="front") return {kind:"front",J:frontJ(fr),g:false};
    const J=sideJ(fr);
    const pr=(fr.pr||[]).map(q=>{const o=Object.assign({},q);for(const k of ["at","from","to","via"]) if(o[k]!=null){if(typeof o[k]==="string") o[k+"Ref"]=o[k];o[k]=pt(J,o[k]);}return o;});
    return {kind:"side",J,pr,g:!!fr.g,rotY:fr.rotY||0,pivot:fr.pivot,lie:!!fr.lie};
  });
}
return {has:(ex,r)=>!!pick(ex,r), draw:(ex,r)=>draw(pick(ex,r)), frames3d, GY};
})();

// ===== 3D mannequin viewer =====
const TD=(()=>{
let loading=null, cur=null;
const HGT=190;
function load(){
  if(window.THREE) return Promise.resolve();
  if(loading) return loading;
  loading=new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
    s.onload=res;s.onerror=()=>{loading=null;rej();};document.head.appendChild(s);});
  return loading;
}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim()||"#888";
function stop(){if(cur){cur.stop();cur=null;}}
const JMAP={W:"wr",F:"ft",K:"kn",E:"el",H:"pelv",S:"neck",C:"head"};

// 2D frame → named 3D points (Y up, 1 unit = 1 drawing px). Side view: left/right limbs split along Z.
function to3d(fr){
  if(fr.kind==="raw") return Object.assign({},fr.K);
  const P0=(p,z)=>[p[0],-p[1],z||0];
  // optional turn around the vertical axis (e.g. a pirouette out of a handstand)
  const rot=fr.rotY?fr.rotY*Math.PI/180:0, px=fr.pivot?fr.pivot[0]:0;
  const P=rot?(p,z)=>{const q=P0(p,z),dx=q[0]-px;return [px+dx*Math.cos(rot)-q[2]*Math.sin(rot),q[1],dx*Math.sin(rot)+q[2]*Math.cos(rot)];}:P0, k={};
  if(fr.kind==="front"){const J=fr.J;
    Object.assign(k,{shL:P(J.sL),shR:P(J.sR),elL:P(J.eL),elR:P(J.eR),wrL:P(J.hL),wrR:P(J.hR),
      hpL:P(J.pL),hpR:P(J.pR),knL:P(J.kL),knR:P(J.kR),ftL:P(J.fL),ftR:P(J.fR),
      neck:P(J.neck),pelv:P([(J.pL[0]+J.pR[0])/2,J.pL[1]]),head:P(J.head)});
  } else if(fr.lie){const J=fr.J;
    // lying on the side: the drawing plane is the body's frontal plane, so left/right split inside the plane
    const dx=J.S[0]-J.H[0],dy=J.S[1]-J.H[1],d=Math.hypot(dx,dy)||1,n=[-dy/d,dx/d];
    const Q=(p,o,z)=>P([p[0]+n[0]*o,p[1]+n[1]*o],z||0);
    Object.assign(k,{shL:Q(J.S,14),shR:Q(J.S,-14),elL:Q(J.E,22,4),elR:Q(J.E,-22,4),wrL:Q(J.W,5,-7),wrR:Q(J.W,-5,-7),
      hpL:Q(J.H,9),hpR:Q(J.H,-9),knL:Q(J.K,6),knR:Q(J.K,-6),ftL:Q(J.F,4),ftR:Q(J.F,-4),
      neck:P(J.S),pelv:P(J.H),head:P(J.C)});
  } else {const J=fr.J;
    Object.assign(k,{shL:P(J.S,14),shR:P(J.S,-14),elL:P(J.E,14),elR:P(J.E2||J.E,-14),wrL:P(J.W,14),wrR:P(J.W2||J.W,-14),
      hpL:P(J.H,9),hpR:P(J.H,-9),knL:P(J.K,9),knR:P(J.K2||J.K,-9),ftL:P(J.F,9),ftR:P(J.F2||J.F,-9),
      neck:P(J.S),pelv:P(J.H),head:P(J.C)});
    // moving equipment points (bands / weights) are carried as extra keys so they animate with the body
    (fr.pr||[]).forEach((q,i)=>{
      if(q.k==="band"){k["b"+i+"a"]=P(q.from);k["b"+i+"b"]=P(q.to);k["b"+i+"v"]=q.via?P(q.via):null;}
      if(q.k==="wt"){k["w"+i]=P([q.at[0]+(q.dx||0),q.at[1]+(q.dy||0)]);}
    });
  }
  return k;
}
const SEG=[["neck","pelv",8.5],["shL","shR",5],["hpL","hpR",6.5],["shL","elL",4.6],["elL","wrL",4],
  ["shR","elR",4.6],["elR","wrR",4],["hpL","knL",6.2],["knL","ftL",5],["hpR","knR",6.2],["knR","ftR",5]];

function build(host,frames){
  const T=window.THREE, W=()=>host.clientWidth||300;
  const renderer=new T.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.setSize(W(),HGT);
  const cv=renderer.domElement;cv.className="tdcv";host.prepend(cv);
  const scene=new T.Scene(), cam=new T.PerspectiveCamera(35,W()/HGT,1,4000);
  scene.add(new T.HemisphereLight(0xffffff,0x667070,0.95));
  const dl=new T.DirectionalLight(0xffffff,0.75);dl.position.set(180,320,260);scene.add(dl);
  const mBody=new T.MeshStandardMaterial({color:css("--ink"),roughness:0.55,metalness:0.05});
  const mEq=new T.MeshStandardMaterial({color:css("--muted"),roughness:0.6});
  const mWall=new T.MeshStandardMaterial({color:css("--muted"),roughness:1,transparent:true,opacity:0.25});
  const mAcc=new T.MeshStandardMaterial({color:css("--accent"),roughness:0.5});
  const mGround=new T.MeshStandardMaterial({color:css("--muted"),roughness:1,transparent:true,opacity:0.18});
  const keys=frames.map(to3d);
  const cyl=new T.CylinderGeometry(1,1,1,14), sph=new T.SphereGeometry(1,16,12), tor=new T.TorusGeometry(6.5,1.6,10,24);
  const V=p=>new T.Vector3(p[0],p[1],p[2]);
  function place(m,a,b,r){const d=new T.Vector3().subVectors(b,a),len=d.length()||0.001;
    m.position.copy(a).addScaledVector(d,0.5);m.scale.set(r,len,r);
    m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());}
  const staticCyl=(a,b,r,mat)=>{const m=new T.Mesh(cyl,mat||mEq);place(m,V(a),V(b),r);scene.add(m);};
  const staticBox=(cx,cy,cz,w,h,d,mat)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat||mEq);m.position.set(cx,cy,cz);scene.add(m);};
  // body
  const segs=SEG.map(([a,b,r])=>{const m=new T.Mesh(cyl,mBody);scene.add(m);return {a,b,r,m};});
  const joints={};for(const s of SEG) for(const k of [s[0],s[1]]) if(!joints[k]||joints[k].r<s[2]){
    if(joints[k]) scene.remove(joints[k].m);const m=new T.Mesh(sph,mBody);m.scale.setScalar(s[2]);scene.add(m);joints[k]={m,r:s[2]};}
  const head=new T.Mesh(sph,mBody);head.scale.setScalar(10.5);scene.add(head);
  // equipment
  const GY=ILLV.GY, dyn=[], seen=new Set();
  const once=(q,fn)=>{const id=JSON.stringify(q);if(!seen.has(id)){seen.add(id);fn();}};
  const f0=frames[0];
  if(f0.kind==="raw"){
    for(const q of f0.props3d||[]) if(q.pole) staticCyl([q.pole[0],q.pole[1],0],[q.pole[0],q.pole[2],0],3);
    if(f0.g){const g=new T.Mesh(new T.CylinderGeometry(115,115,1,40),mGround);g.position.set(-40,-GY-4,0);scene.add(g);}
  } else if(f0.kind==="front"){const J=f0.J;
    if(J.eq==="bar"){const x1=Math.min(-75,J.hL[0]-15),x2=Math.max(75,J.hR[0]+15);staticCyl([x1,-J.by,0],[x2,-J.by,0],2.6);}
    else for(const s of ["L","R"]) dyn.push({ring:new T.Mesh(tor,mEq),strap:new T.Mesh(cyl,mEq),j:"wr"+s,len:60,axis:"z"});
    if(J.box){const y=Math.max(J.fL[1],J.fR[1])+4;staticBox(0,-(y+13),0,52,26,40);}
    if(frames.some(f=>f.J.band)) dyn.push({fband:true,m1:new T.Mesh(cyl,mAcc),m2:new T.Mesh(cyl,mAcc),by:J.by});
    if(frames.some(f=>f.J.w)) dyn.push({fw:true,m:new T.Mesh(tor,mAcc)});
    if(frames.some(f=>f.J.towel)) dyn.push({towel:true,m:new T.Mesh(cyl,mAcc),by:J.by});
  } else {
    frames.forEach(fr=>(fr.pr||[]).forEach((q,i)=>{
      if(q.k==="bar") once(["bar",q.at],()=>staticCyl([q.at[0],-q.at[1],-45],[q.at[0],-q.at[1],45],2.6));
      else if(q.k==="hbar") once(["hbar",q.y,q.x1,q.x2],()=>{for(const z of [-21,21]) staticCyl([q.x1,-q.y,z],[q.x2,-q.y,z],2.6);});
      else if(q.k==="box") once(["box",q.x,q.y,q.w,q.h],()=>{const h=q.h!=null?q.h:GY+3.5-q.y;staticBox(q.x+q.w/2,-(q.y+h/2),0,q.w,h,60);});
      else if(q.k==="wall") once(["wall",q.x],()=>{const h=GY+4-q.y1;staticBox(q.x,-(q.y1+h/2),0,2,h,130,mWall);});
      else if(q.k==="pole") once(["pole",q.x],()=>staticCyl([q.x,-q.y1,0],[q.x,-q.y2,0],3));
      else if(q.k==="ring") once(["ring",q.atRef||q.at],()=>{
        if(q.atRef&&JMAP[q.atRef]&&(q.atRef==="W"||q.atRef==="F")){for(const s of ["L","R"]) dyn.push({ring:new T.Mesh(tor,mEq),strap:new T.Mesh(cyl,mEq),j:JMAP[q.atRef]+s,len:q.len||55,axis:"x"});}
        else for(const z of [-14,14]){const m=new T.Mesh(tor,mEq);m.position.set(q.at[0],-q.at[1],z);m.rotation.y=Math.PI/2;scene.add(m);
          staticCyl([q.at[0],-q.at[1]+6,z],[q.at[0],-q.at[1]+(q.len||55),z],0.9);}});
      else if(q.k==="band") once(["band",i],()=>dyn.push({band:i,m1:new T.Mesh(cyl,mAcc),m2:new T.Mesh(cyl,mAcc)}));
      else if(q.k==="wt") once(["wt",i],()=>dyn.push({wt:i,m:new T.Mesh(tor,mAcc)}));
    }));
    if(frames.some(f=>f.g)){const g=new T.Mesh(new T.CylinderGeometry(115,115,1,40),mGround);g.position.set(0,-GY-4,0);scene.add(g);dyn.push({ground:g});}
  }
  for(const d of dyn) for(const k of ["ring","strap","m","m1","m2"]) if(d[k]) scene.add(d[k]);
  function pose(k){
    for(const s of segs) place(s.m,V(k[s.a]),V(k[s.b]),s.r);
    for(const n in joints) joints[n].m.position.set(...k[n]);
    head.position.set(...k.head);
    for(const d of dyn){
      if(d.ground){d.ground.position.x=(k.pelv[0]+k.head[0])/2;}
      else if(d.ring){const w=k[d.j];d.ring.position.set(w[0],w[1]-1,w[2]);d.ring.rotation.y=d.axis==="x"?Math.PI/2:0;
        place(d.strap,V([w[0],w[1]+6,w[2]]),V([w[0],w[1]+d.len,w[2]]),0.9);}
      else if(d.band!=null){const a=k["b"+d.band+"a"],b=k["b"+d.band+"b"],v=k["b"+d.band+"v"];
        if(!a){d.m1.visible=d.m2.visible=false;continue;}d.m1.visible=d.m2.visible=true;
        const mid=v?[v[0],v[1]-12,0]:[(a[0]+b[0])/2,(a[1]+b[1])/2,0];place(d.m1,V(a),V(mid),1.6);place(d.m2,V(mid),V(b),1.6);}
      else if(d.wt!=null){const w=k["w"+d.wt];if(w){d.m.visible=true;d.m.position.set(...w);}else d.m.visible=false;}
      else if(d.fband){const fL=k.ftL,fR=k.ftR;place(d.m1,V([-6,-d.by,0]),V([fL[0],fL[1]-6,0]),1.4);place(d.m2,V([6,-d.by,0]),V([fR[0],fR[1]-6,0]),1.4);}
      else if(d.fw){const p=k.pelv;d.m.position.set(p[0],p[1]-14,4);}
      else if(d.towel){const w=k.wrR;place(d.m,V([w[0],-d.by,0]),V(w),1.4);}
    }
  }
  const lerpK=(a,b,t)=>{const o={};for(const n in a){if(!a[n]||!b[n]){o[n]=a[n];continue;}o[n]=[0,1,2].map(i=>a[n][i]+(b[n][i]-a[n][i])*t);}return o;};
  const seq=keys.length>1?[...keys.keys(),...[...keys.keys()].reverse().slice(1,-1)]:[0];
  const HOLD=0.7, MOVE=1.15, STEP=HOLD+MOVE;
  // camera framing over every frame
  const all=keys.flatMap(k=>Object.values(k).filter(Boolean));
  const mn=[0,1,2].map(i=>Math.min(...all.map(p=>p[i]))), mx=[0,1,2].map(i=>Math.max(...all.map(p=>p[i])));
  const ctr=V(mn.map((v,i)=>(v+mx[i])/2)), size=Math.max(mx[0]-mn[0],mx[1]-mn[1],110);
  let az=f0.kind==="front"?0.55:(f0.kind==="raw"?0.35:-0.75), el=0.22, dist=size*(f0.kind==="front"?2.0:2.25);
  function camUpdate(){cam.position.set(ctr.x+dist*Math.sin(az)*Math.cos(el),ctr.y+dist*Math.sin(el),ctr.z+dist*Math.cos(az)*Math.cos(el));cam.lookAt(ctr);}
  camUpdate();
  let drag=null;
  cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener("pointermove",e=>{if(!drag) return;az-=(e.clientX-drag.x)*0.012;el=Math.max(-0.15,Math.min(1.2,el+(e.clientY-drag.y)*0.008));
    drag={x:e.clientX,y:e.clientY};camUpdate();if(!playing) renderer.render(scene,cam);});
  const end=()=>{drag=null;};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let playing=!reduce&&keys.length>1, t0=performance.now(), tPaused=0, raf=0, alive=true;
  const btn=host.querySelector(".tdplay");
  const setBtn=()=>{if(btn){btn.textContent=playing?"⏸ עצירה":"▶ הפעלה";btn.hidden=keys.length<2;}};setBtn();
  if(btn) btn.onclick=()=>{playing=!playing;if(playing){t0=performance.now()-tPaused;loop();}setBtn();};
  function frameAt(sec){
    if(keys.length<2) return keys[0];
    const total=seq.length*STEP, tt=sec%total, i=Math.floor(tt/STEP), local=tt-i*STEP;
    const a=keys[seq[i]], b=keys[seq[(i+1)%seq.length]];
    if(local<HOLD) return a;
    const u=(local-HOLD)/MOVE, e=u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    return lerpK(a,b,e);
  }
  function loop(){if(!alive) return;cancelAnimationFrame(raf);
    const sec=(performance.now()-t0)/1000;tPaused=sec*1000;pose(frameAt(sec));renderer.render(scene,cam);
    if(playing) raf=requestAnimationFrame(loop);}
  pose(keys[0]);renderer.render(scene,cam);if(playing) loop();
  const ro=new ResizeObserver(()=>{renderer.setSize(W(),HGT);cam.aspect=W()/HGT;cam.updateProjectionMatrix();renderer.render(scene,cam);});ro.observe(host);
  return {stop(){alive=false;cancelAnimationFrame(raf);ro.disconnect();renderer.dispose();cyl.dispose();sph.dispose();tor.dispose();cv.remove();}};
}
function fallback(host,ex,ring,msg){
  const m=host.querySelector(".tdmsg");if(m) m.textContent=msg;
  const d=document.createElement("div");d.className="ill";d.innerHTML=ILLV.draw(ex,ring);host.prepend(d);
}
async function mount(host,ex,ring){
  stop();
  try{await load();}catch(e){if(host.isConnected) fallback(host,ex,ring,"אין חיבור לתלת-ממד כרגע, מוצג איור רגיל");return;}
  if(!host.isConnected) return;
  try{cur=build(host,ILLV.frames3d(ex,ring));host.querySelector(".tdmsg").textContent="גוררים כדי לסובב";}
  catch(e){fallback(host,ex,ring,"התלת-ממד לא נתמך במכשיר הזה, מוצג איור רגיל");}
}

const st = {c:0, t:0, l:0, open:-1};
try{ const s = JSON.parse(localStorage.getItem("cal-rings-ladders")||"{}"); if(DATA[s.c]){st.c=s.c; const T=DATA[s.c].tracks; if(T[s.t]){st.t=s.t; if(T[s.t].ladders[s.l]) st.l=s.l;}} }catch(e){}
const save=()=>{try{localStorage.setItem("cal-rings-ladders",JSON.stringify({c:st.c,t:st.t,l:st.l}))}catch(e){}};
const TR=()=>DATA[st.c].tracks;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const firstSentence=s=>{const m=s.match(/^[^.]*\./);return m?m[0]:s};

function renderCats(){
  $("cats").innerHTML = DATA.map((c,i)=>`<button class="cat" aria-pressed="${i===st.c}" data-i="${i}">${esc(c.name)}</button>`).join("");
}
function renderTracks(){
  $("tracks").innerHTML = TR().map((t,i)=>{
    const n=t.ladders.reduce((a,l)=>a+l.steps.length,0);
    return `<button class="track" aria-pressed="${i===st.t}" data-i="${i}">${esc(t.name)}<small>${n} תרגילים</small></button>`}).join("");
}
function renderLadders(){
  $("ladders").innerHTML = TR()[st.t].ladders.map((l,i)=>
    `<button class="lad" aria-pressed="${i===st.l}" data-i="${i}">${esc(l.name)}</button>`).join("");
}
function dots(n){let s="";for(let i=1;i<=8;i++)s+=`<i class="${i<=n?"on":""}"></i>`;return s}
function renderRail(){
  const lad = TR()[st.t].ladders[st.l];
  $("ladname").textContent = lad.name;
  $("ladcount").textContent = `${lad.steps.length} שלבים · מהקל לקשה`;
  $("rail").innerHTML = lad.steps.map((s,i)=>{
    const open = i===st.open;
    return `<li class="step${open?" open":""}">
      <button class="num" data-i="${i}" tabindex="-1" aria-label="שלב ${i+1}">${i+1}</button>
      <div class="card">
        <div class="head" role="button" tabindex="0" data-i="${i}" aria-expanded="${open}">
          <div class="top"><span class="name">${esc(s.ex)}</span>
            <span class="lvl">רמה ${s.lvl}<span class="dots">${dots(s.lvl)}</span></span></div>
          <p class="one">${esc(firstSentence(s.how))}</p>
        </div>
        ${open?`<div class="body">
          ${ILLV.has(s.ex,st.c===1)?`<div class="td"><div class="tdbar"><span class="tdmsg">טוען תלת-ממד…</span><button class="tdplay" hidden>⏸ עצירה</button></div></div>`:""}
          <p class="how">${esc(s.how)}</p>
          <div class="box pass"><b>מתי עוברים לשלב הבא</b>${esc(s.pass)}</div>
          <div class="grid2">
            <div class="box"><b>אם קשה מדי — סיוע</b>${esc(s.assist)}</div>
            <div class="box"><b>ציוד</b>${esc(s.equip)}</div>
            <div class="box"><b>שרירים עיקריים</b>${esc(s.prim)}</div>
            <div class="box"><b>שרירים משניים</b>${esc(s.sec)}</div>
            <div class="box"><b>דגשים</b>${esc(s.cues)}</div>
            <div class="box"><b>טעויות נפוצות</b>${esc(s.mist)}</div>
          </div>
          <div class="nav">
            <button class="mv" data-go="${i-1}" ${i===0?"disabled":""}>→ שלב קודם</button>
            <a href="${esc(s.img)}" target="_blank" rel="noopener">תמונות של התרגיל ↗</a>
            <button class="mv" data-go="${i+1}" ${i===lad.steps.length-1?"disabled":""}>שלב הבא ←</button>
          </div>
        </div>`:""}
      </div></li>`}).join("");
  TD.stop();
  const tdh=document.querySelector(".td");
  if(tdh&&st.open>=0) TD.mount(tdh,lad.steps[st.open].ex,st.c===1);
}
function all(){renderCats();renderTracks();renderLadders();renderRail()}
$("cats").onclick=e=>{const b=e.target.closest(".cat");if(!b)return;st.c=+b.dataset.i;st.t=0;st.l=0;st.open=-1;save();all()};
$("tracks").onclick=e=>{const b=e.target.closest(".track");if(!b)return;st.t=+b.dataset.i;st.l=0;st.open=-1;save();all()};
$("ladders").onclick=e=>{const b=e.target.closest(".lad");if(!b)return;st.l=+b.dataset.i;st.open=-1;save();renderLadders();renderRail()};
const hasSelection=()=>{try{return String(window.getSelection()).length>0}catch(e){return false}};
$("rail").onkeydown=e=>{
  const h=e.target.closest(".head");
  if(h && (e.key==="Enter"||e.key===" ")){e.preventDefault();h.click();}
};
$("rail").onclick=e=>{
  const h=e.target.closest(".head, .num"), g=e.target.closest(".mv");
  if(h && h.classList.contains("head") && hasSelection()) return;
  if(h){const i=+h.dataset.i;st.open=st.open===i?-1:i;renderRail();}
  else if(g){st.open=+g.dataset.go;renderRail();}
  else return;
  const el=document.querySelectorAll(".step")[st.open];
  if(el) el.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
};
all();
</script>
