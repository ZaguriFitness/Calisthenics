<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one track → one ladder → a vertical rail of step cards; one card open at a time */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#18211F; --muted:#5B6866; --line:#D3DCDA;
  --accent:#1E6B78; --accent-soft:#D6E8EA; --chalk:#F7F9F9;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121817; --surface:#1B2321; --ink:#E7EEEC; --muted:#9AA8A5; --line:#2E3A38;
  --accent:#6FB8C4; --accent-soft:#1F3639; --chalk:#18201E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1B2321; --ink:#E7EEEC; --muted:#9AA8A5; --line:#2E3A38;
  --accent:#6FB8C4; --accent-soft:#1F3639; --chalk:#18201E; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 18px}
.label{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 0 8px}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
@media (max-width:480px){.tracks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-bottom:20px;border:1.5px solid var(--line);border-radius:12px;padding:4px;background:var(--surface)}
.cat{font:inherit;font-family:var(--display);font-size:1.1rem;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.track{font:inherit;font-weight:700;font-size:1rem;padding:12px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.track small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.track[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.track[aria-pressed="true"] small{color:var(--surface);opacity:.85}
.ladders{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.lad{font:inherit;font-size:.95rem;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.lad[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ladhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.ladhead h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0}
.ladhead span{color:var(--muted);font-size:.9rem}
.rail{list-style:none;margin:0;padding:0;display:grid;gap:10px;position:relative}
.rail::before{content:"";position:absolute;top:24px;bottom:24px;inset-inline-start:23px;width:2px;background:var(--line)}
.step{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:start}
.num{width:48px;height:48px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:1.2rem;position:relative;z-index:1;font-variant-numeric:tabular-nums;color:var(--ink);padding:0;cursor:pointer}
.step.open .num{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;min-width:0;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.card *{-webkit-user-select:text;user-select:text}
.step.open .card{border-color:var(--accent)}
.head{all:unset;box-sizing:border-box;display:block;width:100%;padding:12px 14px;cursor:pointer}
.head:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.top{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.name{font-weight:700;font-size:1.05rem;min-width:0}
.name .sep,.qres .sep{color:var(--line);font-weight:400}
.name .he,.qres .he{font-weight:600}
.lvl{flex:none;display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.dots{display:flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.one{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.step.open .one{display:none}
.body{padding:0 14px 14px;display:grid;gap:12px}
.td{background:var(--chalk);border-radius:10px;overflow:hidden}
.tdcv{display:block;width:100%;touch-action:pan-y;cursor:grab}
.tdbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;font-size:.85rem;color:var(--muted)}
.tdplay{font:inherit;font-size:.85rem;padding:4px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.ill{background:var(--chalk);border-radius:10px;padding:10px 8px 6px}
.ill svg{display:block;width:100%;max-width:300px;max-height:190px;height:auto;margin:0 auto}
.ill .fg{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.ill .hd{fill:var(--ink)}
.ill .fg2{fill:none;stroke:var(--muted);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.ill .wl{stroke:var(--muted);stroke-width:3}
.ill .st{stroke:var(--muted);stroke-width:2}
.ill .rg{fill:none;stroke:var(--muted);stroke-width:3}
.ill .gr{stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
.ill .eqf{fill:var(--muted);opacity:.35}
.ill .br{stroke:var(--muted);stroke-width:5;stroke-linecap:round}
.ill .eqb{fill:none;stroke:var(--muted);stroke-width:2}
.ill .bd{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round}
.ill .wt{fill:none;stroke:var(--accent);stroke-width:4}
.ill .ar{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ill .lb{fill:var(--muted);font-family:var(--body);font-size:13px}
.how{margin:0;font-size:1rem}
.box{background:var(--chalk);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.box b{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.box.pass{background:var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.grid2{grid-template-columns:minmax(0,1fr)}}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.nav .mv{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.nav .mv:disabled{opacity:.35;cursor:default}
.nav a{color:var(--accent);font-weight:700;text-decoration:none}
.nav a:hover{text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
:root{--warn:#A4501A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--warn:#E8A06B}}
:root[data-theme="dark"]{--warn:#E8A06B}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px -16px 16px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:.95rem;padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.search,.addrow input,.fl textarea,.fl select,.srow select,#sadd{font:inherit;font-size:16px;width:100%;box-sizing:border-box;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.search{margin-bottom:14px}
.qres{list-style:none;margin:0 0 14px;padding:0;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.qres button{all:unset;box-sizing:border-box;display:block;width:100%;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.qres li:last-child button{border-bottom:0}
.qres b{display:block}
.qres small,.lad small,.blk h3 small,.fl.lv span small{color:var(--muted);font-size:.8rem;font-family:var(--body);font-weight:400}
.qres .none{padding:9px 12px;color:var(--muted)}
.addrow{display:flex;gap:8px;margin-bottom:14px}
.addrow button,.bk button,.btnlike{font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--surface);cursor:pointer;flex:none}
.bk{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.bk button,.btnlike{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.fine{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.empty{color:var(--muted);margin:12px 0}
details.tr{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px}
details.tr[open]{border-color:var(--accent)}
details.tr summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
details.tr summary::-webkit-details-marker{display:none}
details.tr summary span{color:var(--muted);font-size:.85rem}
.trb{padding:0 14px 14px;display:grid;gap:12px}
.fl{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:700}
.fl.lv span{color:var(--ink);font-size:.95rem;display:flex;gap:6px;align-items:baseline}
.fl em{font-style:normal;font-weight:400}
.fl select,.srow select{direction:ltr;text-align:right;unicode-bidi:plaintext}
.hist{background:var(--chalk);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hist b{display:block;font-size:.78rem;color:var(--muted)}
.hist p{margin:2px 0}
.del{font:inherit;justify-self:start;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--warn);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.seg{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}
.seg .track{padding:9px 8px}
.opt,.blk{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px}
.opt summary,.blk summary,.howto summary{list-style:none;cursor:pointer}
.opt summary::-webkit-details-marker,.blk summary::-webkit-details-marker,.howto summary::-webkit-details-marker{display:none}
.opt summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;font-weight:700;white-space:nowrap}
.opt summary span{color:var(--muted);font-weight:400;font-size:.9rem;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt summary::after,.blk summary::after{content:"▾";color:var(--muted);flex:none;transition:transform .15s}
.opt[open] summary::after,.blk[open] summary::after{transform:rotate(180deg)}
.opt .chips{padding:0 14px 12px;margin:0}
.blks{margin-top:16px}
.blk[open]{border-color:var(--accent)}
.blk summary{display:flex;align-items:center;gap:10px;padding:12px 14px}
.blk .bt{flex:1;min-width:0;font-family:var(--display);font-size:1.1rem;display:flex;align-items:baseline;gap:10px}
.blk .bm{display:flex;gap:8px;font-size:.85rem;color:var(--accent);font-weight:700}
.blk .bm i{font-style:normal}
.blk>:not(summary){margin-inline:14px}
.blk .rm{font:inherit;font-size:.85rem;padding:4px 0 12px;border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:underline}
.addex{margin:4px 0 14px;color:var(--muted)}
.opt.plan summary{font-family:var(--display);font-weight:400;font-size:1.15rem}
.opt.plan[open]{border-color:var(--accent)}
.opt .label{margin:4px 14px 6px}
.plist{display:grid;gap:6px;padding:0 14px 12px}
.pl{font:inherit;text-align:right;display:grid;gap:2px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--chalk);color:var(--ink);cursor:pointer}
.pl b{display:flex;justify-content:space-between;gap:8px}
.pl b small{color:var(--muted);font-weight:400}
.pl span{color:var(--muted);font-size:.88rem}
.pl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pwhen{color:var(--muted);font-size:.92rem;margin:-2px 2px 12px}
.guide{padding:0 14px 12px;display:grid;gap:8px;font-size:.95rem}
.guide p{margin:0}
.guide b{display:block;font-size:.85rem;color:var(--accent)}
.blk .tm{direction:ltr;unicode-bidi:isolate;font-style:normal;font-family:var(--body);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.blk .how{margin:0 14px 6px;padding-inline-start:20px;display:grid;gap:3px;font-size:.95rem}
.blk h4{margin:12px 14px 0;font-size:.95rem;color:var(--accent)}
.blk>.srow:last-of-type{padding-bottom:12px}
.chips.alt{margin:6px 14px 0}
.sact .tg .hn{display:block;color:var(--ink)}
.st{font-style:normal;color:var(--accent)}
.msg .lbl{margin-top:8px;color:var(--muted);font-size:.85rem}
.eqsum{color:var(--muted);font-size:.85rem;margin-top:0;margin-bottom:6px}
.srow{border-top:1px solid var(--line);padding:8px 0 6px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center}
.srow>.warn,.srow>.sact{grid-column:1/-1}
.sact .tg{flex:1;min-width:0;font-size:.9rem;color:var(--muted)}
.sact .tg b{color:var(--ink);font-weight:600}
.rx summary{cursor:pointer;list-style:none}
.rx summary::-webkit-details-marker{display:none}
.rx summary b::after{content:" ▾"}
.sn{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sn small{color:var(--warn);font-size:.85rem}
.srow p{margin:0;font-size:.95rem}
.srow .as{color:var(--muted);font-size:.88rem}
.warn{color:var(--warn)}
.sact{display:flex;gap:8px;align-items:center}
.sact .mv{font:inherit;font-size:.9rem;font-weight:700;min-width:36px;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.ok{font:inherit;font-size:.9rem;font-weight:700;padding:6px 12px;border-radius:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.ok[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.primary{font:inherit;font-weight:700;font-size:1rem;width:100%;padding:13px;border-radius:12px;border:0;background:var(--accent);color:var(--surface);cursor:pointer;margin-top:6px}
.msg{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.msg p{margin:2px 0}
</style>
</head>
<body>

<div class="wrap" dir="rtl">
  <h1>Calisthenics</h1>
  <nav class="tabs" id="tabs" aria-label="מסכים">
    <button class="tab" data-v="lib" aria-pressed="true">סולמות</button>
    <button class="tab" data-v="tr" aria-pressed="false">מתאמנים</button>
    <button class="tab" data-v="ses" aria-pressed="false">אימון קבוצתי</button>
  </nav>
  <section id="v-lib">
  <input id="q" class="search" type="search" placeholder="חיפוש תרגיל…" autocomplete="off" aria-label="חיפוש תרגיל">
  <ul class="qres" id="qres" hidden></ul>

  <div class="cats" id="cats"></div>

  <p class="label">מסלול</p>
  <div class="tracks" id="tracks"></div>

  <p class="label">סולם</p>
  <div class="ladders" id="ladders"></div>

  <div class="ladhead"><h2 id="ladname"></h2><span id="ladcount"></span></div>
  <ol class="rail" id="rail"></ol>
  </section>

  <section id="v-tr" hidden>
    <p class="sub">לכל מתאמן בוחרים בכל סולם את השלב הקשה ביותר שהוא עושה נקי 3×5. ככה האפליקציה יודעת מה לתת לכל אחד באימון.</p>
    <form id="addtr" class="addrow"><input id="trname" placeholder="שם מתאמן חדש" autocomplete="off" aria-label="שם מתאמן חדש"><button>הוספה</button></form>
    <div id="trlist"></div>
    <div class="bk">
      <button id="exp" type="button">גיבוי לקובץ</button>
      <label class="btnlike">שחזור מגיבוי<input type="file" id="imp" accept="application/json,.json" hidden></label>
    </div>
    <p class="fine">הנתונים נשמרים בטלפון הזה בלבד. כדאי לעשות גיבוי מדי פעם.</p>
  </section>

  <section id="v-ses" hidden>
    <div id="sbody"></div>
    <div class="msg" id="smsg" hidden></div>
  </section>
</div>

<script>
// ===== Simple figure illustrations =====
// Side view: angles in degrees, 0 = right, 90 = down, -90 = up. Ground at y = 200.
// Front view: used for hanging/pulling on a bar or rings.
const ILLV = (()=>{
const GY=200;
const f=n=>Math.round(n*10)/10;
const add=(p,len,a)=>{a=a*Math.PI/180;return [p[0]+Math.cos(a)*len,p[1]+Math.sin(a)*len]};
const line=(pts,cls)=>`<polyline class="${cls}" points="${pts.map(q=>f(q[0])+","+f(q[1])).join(" ")}"/>`;
const ang=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;

// two-link IK. pref: [x,y] direction the middle joint should bend toward
function ik(a0,b0,la,lb,pref){
  const dx=b0[0]-a0[0], dy=b0[1]-a0[1], d=Math.hypot(dx,dy)||0.001;
  if(d>=la+lb-0.3){const ux=dx/d,uy=dy/d;return [[a0[0]+ux*la,a0[1]+uy*la],[a0[0]+ux*(la+lb),a0[1]+uy*(la+lb)]];}
  const ux=dx/d, uy=dy/d, along=(la*la-lb*lb+d*d)/(2*d), h=Math.sqrt(Math.max(0,la*la-along*along));
  const m=[a0[0]+ux*along,a0[1]+uy*along];
  const c1=[m[0]-uy*h,m[1]+ux*h], c2=[m[0]+uy*h,m[1]-ux*h];
  const s1=(c1[0]-m[0])*pref[0]+(c1[1]-m[1])*pref[1];
  return [s1>=0?c1:c2, b0];
}
// ---------- side view ----------
function sideJ(p){
  const H=p.H, t=p.t, S=add(H,50,t);
  const C=add(add(S,15,t),4*(p.face||1),t+90);
  const arm=(A,ua,fa,pref)=>{
    if(A) return ik(S,A,28,26,pref||[-1,0]);
    const E=add(S,28,ua); return [E,add(E,26,fa)];
  };
  const leg=(L,th,sh,pref)=>{
    if(L) return ik(H,L,37,36,pref||[1,0]);
    const K=add(H,37,th); return [K,add(K,36,sh)];
  };
  const J={H,S,C};
  [J.E,J.W]=arm(p.A,p.ua,p.fa,p.eb);
  [J.K,J.F]=leg(p.L,p.th,p.sh,p.kb);
  if(p.A2||p.ua2!=null) [J.E2,J.W2]=arm(p.A2,p.ua2,p.fa2,p.eb2||p.eb);
  if(p.L2||p.th2!=null) [J.K2,J.F2]=leg(p.L2,p.th2,p.sh2,p.kb2||p.kb);
  return J;
}
function pt(J,r){return typeof r==="string"?J[r]:r}
function props(list,J,out,pts){
  for(const q of list||[]){

const DEF={1:["החזקה"],2:["התחלה","סיום"],3:["התחלה","מעבר","סיום"]};
function draw(frames){
  const parts=frames.map(fr=>fr.v==="front"?frontFrame(fr):sideFrame(fr));
  const n=parts.length, GAP=30;
  const bb=parts.map((p,i)=>{const xs=p.pts.map(q=>q[0]);let a=Math.min(...xs)-6,z=Math.max(...xs)+6;
    const lw=((frames[i].label||DEF[n][i]).length*6.6)+6;
    if(z-a<lw){const c=(a+z)/2;a=c-lw/2;z=c+lw/2;}return [a,z]});
  const ys=parts.flatMap(p=>p.pts.map(q=>q[1]));
  const anyG=parts.some(p=>p.ground);
  let minY=Math.min(...ys)-8, maxY=Math.max(...ys,anyG?GY+4:-1e9)+8;
  // place frames right-to-left
  const offs=[]; let x=0;
  for(let i=n-1;i>=0;i--){offs[i]=x-bb[i][0]; x+= (bb[i][1]-bb[i][0]) + (i>0?GAP:0);}
  const totalW=x;
  let s="";
  parts.forEach((p,i)=>{
    const o=offs[i], cx=o+(bb[i][0]+bb[i][1])/2;
    s+=`<g transform="translate(${f(o)},0)">`;
    if(p.ground) s+=`<line class="gr" x1="${f(bb[i][0]-4)}" y1="${GY+4}" x2="${f(bb[i][1]+4)}" y2="${GY+4}"/>`;
    s+=p.svg+`</g>`;
    s+=`<text class="lb" x="${f(cx)}" y="${f(maxY+16)}" text-anchor="middle">${frames[i].label||DEF[n][i]}</text>`;
  });
  for(let i=0;i<n-1;i++){const xr=offs[i]+bb[i][0], xm=xr-GAP/2, y=(minY+maxY)/2;
    s+=`<path class="ar" d="M${f(xm+8)},${f(y)} H${f(xm-8)} M${f(xm-2)},${f(y-6)} L${f(xm-8)},${f(y)} L${f(xm-2)},${f(y+6)}"/>`;}
  return `<svg viewBox="0 ${f(minY)} ${f(totalW)} ${f(maxY-minY+26)}" role="img" aria-label="איור התרגיל">${s}</svg>`;
}

function rowPair(base,len,legLen,R0,opt){opt=opt||{};let R=R0;
  const best=(d,near)=>{let bA=-150,bS=1e9;for(let a=-179;a<=-91;a+=0.5){const S=add(base,len,a);
      const e=Math.abs(Math.hypot(S[0]-R[0],S[1]-R[1])-d);
      const score=near==null? e*4 - S[1]*0.05 : e*4 + Math.abs(a-near)*0.6;
      if(score<bS){bS=score;bA=a;}}return bA;};
  // finish (like a real ring row): ring/bar just in front of the upper chest, elbow bent behind the body, forearm up to the ring
  // upper arm goes back-and-down behind the body, forearm comes forward-up to the ring in front of the chest
  const UA=a=>a+210, FA=a=>a+80;
  const handAt=a=>{const S=add(base,len,a),E=add(S,28,UA(a));return add(E,26,FA(a));};
  const chestA=()=>{let bA=-150,bE=1e9;for(let a=-179;a<=-91;a+=0.5){
      const w=handAt(a),e=Math.hypot(w[0]-R[0],w[1]-R[1]);if(e<bE){bE=e;bA=a;}}return bA;};
  const fr=(a,end)=>{const H=add(base,legLen,a);
    const o=end?{H,t:a,ua:UA(a),fa:FA(a),g:1,pr:[...(opt.pr||[])]}:{H,t:a,A:R,eb:[0,1],g:1,pr:[...(opt.pr||[])]};
    if(legLen===73) o.L=base; else {o.th=Math.atan2(base[1]-H[1],base[0]-H[0])*180/Math.PI;o.sh=90;}
    if(opt.ring) o.pr.push(ring("W",60)); else o.pr.push(bar(end?"W":R));
    return X(o,opt.extra);};
  const aF=chestA(); R=handAt(aF);            // the bar sits exactly where the hand is at the finish
  const a0=best(54);return [fr(a0),fr(aF,true)];
}

function to3d(fr){
  if(fr.kind==="raw") return Object.assign({},fr.K);
  const P0=(p,z)=>[p[0],-p[1],z||0];
  // optional turn around the vertical axis (e.g. a pirouette out of a handstand)
  const rot=fr.rotY?fr.rotY*Math.PI/180:0, px=fr.pivot?fr.pivot[0]:0;
  const P=rot?(p,z)=>{const q=P0(p,z),dx=q[0]-px;return [px+dx*Math.cos(rot)-q[2]*Math.sin(rot),q[1],dx*Math.sin(rot)+q[2]*Math.cos(rot)];}:P0, k={};
  if(fr.kind==="front"){const J=fr.J;
    Object.assign(k,{shL:P(J.sL),shR:P(J.sR),elL:P(J.eL),elR:P(J.eR),wrL:P(J.hL),wrR:P(J.hR),
      hpL:P(J.pL),hpR:P(J.pR),knL:P(J.kL),knR:P(J.kR),ftL:P(J.fL),ftR:P(J.fR),
      neck:P(J.neck),pelv:P([(J.pL[0]+J.pR[0])/2,J.pL[1]]),head:P(J.head)});
  } else if(fr.lie){const J=fr.J;
    // lying on the side: the drawing plane is the body's frontal plane, so left/right split inside the plane
    const dx=J.S[0]-J.H[0],dy=J.S[1]-J.H[1],d=Math.hypot(dx,dy)||1,n=[-dy/d,dx/d];
    const Q=(p,o,z)=>P([p[0]+n[0]*o,p[1]+n[1]*o],z||0);
    Object.assign(k,{shL:Q(J.S,14),shR:Q(J.S,-14),elL:Q(J.E,22,4),elR:Q(J.E,-22,4),wrL:Q(J.W,5,-7),wrR:Q(J.W,-5,-7),
      hpL:Q(J.H,9),hpR:Q(J.H,-9),knL:Q(J.K,6),knR:Q(J.K,-6),ftL:Q(J.F,4),ftR:Q(J.F,-4),
      neck:P(J.S),pelv:P(J.H),head:P(J.C)});
  } else {const J=fr.J;
    Object.assign(k,{shL:P(J.S,14),shR:P(J.S,-14),elL:P(J.E,14),elR:P(J.E2||J.E,-14),wrL:P(J.W,14),wrR:P(J.W2||J.W,-14),
      hpL:P(J.H,9),hpR:P(J.H,-9),knL:P(J.K,9),knR:P(J.K2||J.K,-9),ftL:P(J.F,9),ftR:P(J.F2||J.F,-9),
      neck:P(J.S),pelv:P(J.H),head:P(J.C)});
    // moving equipment points (bands / weights) are carried as extra keys so they animate with the body
    (fr.pr||[]).forEach((q,i)=>{

    });
  }

}

const trById=id=>CO.trainees.find(t=>t.id===id);
const lvIdx=(tr,k)=>{const L=LAD(k),n=tr.lv&&tr.lv[k];return L&&n?L.steps.findIndex(s=>s.ex===n):-1};
const exName=s=>s.en||s.ex;
const exFull=s=>s.he?`${exName(s)} | ${s.he}`:exName(s);
const exByKey=(k,ex)=>{const L=LAD(k),s=L&&L.steps.find(x=>x.ex===ex);return s?exFull(s):ex};
const stepOpts=(L,i)=>`<option value="">— עוד לא נבדק —</option>`+L.steps.map((s,j)=>`<option value="${j}"${j===i?" selected":""}>${j+1}. ${esc(exName(s))}</option>`).join("");
const ladLabel=L=>`${esc(L.l)}<small>${esc(L.t)}${L.ci===1?" · טבעות":""}</small>`;
const fmtDate=d=>{try{return new Date(d).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})}catch(e){return ""}};

// ---------- views ----------
let view="lib";
function show(v){
  view=v;
  [["lib","v-lib"],["tr","v-tr"],["ses","v-ses"]].forEach(([id,s])=>$(s).hidden=id!==v);
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  try{localStorage.setItem("cal-view",v)}catch(e){}
  if(v==="lib") renderRail(); else TD.stop();
  if(v==="tr") renderTr();
  if(v==="ses") renderSes();
}
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(b){show(b.dataset.v);window.scrollTo(0,0);}};
function openStep(k,x){
  const L=LAD(k);if(!L)return;
  st.c=L.ci;st.t=L.ti;st.l=L.li;st.open=x;save();
  renderCats();renderTracks();renderLadders();show("lib");
  const el=document.querySelectorAll(".step")[x];
  if(el) el.scrollIntoView({block:"start"});
}

// ---------- library search ----------
$("q").oninput=()=>{
  const q=$("q").value.trim().toLowerCase();
  if(q.length<2){$("qres").innerHTML="";$("qres").hidden=true;return;}
  const out=[];
  for(const L of LADS) L.steps.forEach((s,i)=>{if(out.length<25&&[s.ex,s.en,s.he].some(x=>x&&x.toLowerCase().includes(q))) out.push({L,s,i});});
  $("qres").hidden=false;
  $("qres").innerHTML=out.length?out.map(o=>`<li><button data-k="${esc(o.L.key)}" data-x="${o.i}"><b><bdi>${esc(exName(o.s))}</bdi>${o.s.he?`<span class="sep"> | </span><bdi class="he">${esc(o.s.he)}</bdi>`:""}</b><small>${esc(o.L.l)} · שלב ${o.i+1}${o.L.ci===1?" · טבעות":""}</small></button></li>`).join("")
    :`<li class="none">לא נמצא תרגיל בשם הזה</li>`;
};
$("qres").onclick=e=>{const b=e.target.closest("button[data-k]");if(!b)return;$("q").value="";$("qres").innerHTML="";$("qres").hidden=true;openStep(b.dataset.k,+b.dataset.x);};

// ---------- trainees ----------
const openTr=new Set();
function renderTr(){
  $("trlist").innerHTML=CO.trainees.length?CO.trainees.map(tr=>{
    const keys=[...new Set([...MAIN,...Object.keys(tr.lv||{})])].filter(k=>LAD(k));
    const set=keys.filter(k=>lvIdx(tr,k)>=0).length;
    const others=LADS.filter(L=>!keys.includes(L.key));
    const hist=CO.log.flatMap(g=>(g.ch||[]).filter(c=>c.id===tr.id).map(c=>({...c,d:g.d}))).slice(-5).reverse();
    return `<details class="tr" data-id="${tr.id}"${openTr.has(tr.id)?" open":""}>
      <summary><b>${esc(tr.name)}</b><span>${set} סולמות מוגדרים</span></summary>
      <div class="trb">
        <label class="fl">הערות (פציעות, מטרות)<textarea data-f="note" rows="2">${esc(tr.note||"")}</textarea></label>
        ${keys.map(k=>{const L=LAD(k),i=lvIdx(tr,k);return `<label class="fl lv"><span>${ladLabel(L)}</span>
          <select data-k="${esc(k)}">${stepOpts(L,i)}</select>${i>=0?`<em>${esc(L.steps[i].he||"")}${L.steps[i].he?" · ":""}יעד למעבר: ${esc(L.steps[i].pass)}</em>`:""}</label>`}).join("")}
        <label class="fl">הוספת סולם נוסף<select data-add="1"><option value="">בחר סולם…</option>${others.map(L=>`<option value="${esc(L.key)}">${esc(L.l)} (${esc(L.t)}${L.ci===1?", טבעות":""})</option>`).join("")}</select></label>
        ${hist.length?`<div class="hist"><b>עליות אחרונות</b>${hist.map(h=>{const L=LAD(h.k);return `<p>${fmtDate(h.d)} · ${esc(L?L.l:"")}: ${esc(exByKey(h.k,h.to))}</p>`}).join("")}</div>`:""}
        <button class="del" type="button">מחיקת ${esc(tr.name)}</button>
      </div></details>`}).join("")
    :`<p class="empty">עוד אין מתאמנים. כותבים שם ולוחצים "הוספה".</p>`;
}
$("addtr").onsubmit=e=>{
  e.preventDefault();const n=$("trname").value.trim();if(!n)return;
  const tr={id:uid(),name:n,note:"",lv:{}};CO.trainees.push(tr);openTr.add(tr.id);
  if(!CO.ses.present.includes(tr.id)) CO.ses.present.push(tr.id);
  csave();$("trname").value="";renderTr();
};
$("trlist").addEventListener("toggle",e=>{const d=e.target.closest&&e.target.closest("details.tr");if(!d)return;d.open?openTr.add(d.dataset.id):openTr.delete(d.dataset.id);},true);
$("trlist").onchange=e=>{
  const d=e.target.closest("details.tr");if(!d)return;const tr=trById(d.dataset.id);if(!tr)return;tr.lv=tr.lv||{};
  const t=e.target;
  if(t.dataset.f==="note"){tr.note=t.value;csave();return;}
  if(t.dataset.add){if(t.value){tr.lv[t.value]=tr.lv[t.value]||"";csave();renderTr();}return;}
  if(t.dataset.k){const L=LAD(t.dataset.k);tr.lv[t.dataset.k]=t.value===""?"":L.steps[+t.value].ex;csave();renderTr();}
};
$("trlist").onclick=e=>{
  const b=e.target.closest(".del");if(!b)return;const d=b.closest("details.tr"),tr=trById(d.dataset.id);
  if(!tr||!confirm(`למחוק את ${tr.name}?`))return;
  CO.trainees=CO.trainees.filter(x=>x!==tr);CO.ses.present=CO.ses.present.filter(x=>x!==tr.id);csave();renderTr();
};
$("exp").onclick=async()=>{
  const txt=JSON.stringify({app:"calisthenics-coach",v:1,data:{trainees:CO.trainees,log:CO.log}},null,1);
  const name=`calisthenics-backup-${new Date().toISOString().slice(0,10)}.json`;
  try{const f=new File([txt],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return;}}
  catch(err){if(err&&err.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
};
$("imp").onchange=async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text()),d=j.data||j;if(!Array.isArray(d.trainees))throw 0;
    if(confirm(`לשחזר ${d.trainees.length} מתאמנים מהגיבוי? זה מחליף את הרשימה הנוכחית.`)){
      CO.trainees=d.trainees;CO.log=Array.isArray(d.log)?d.log:[];CO.ses.present=CO.trainees.map(t=>t.id);CO.ses.done={};csave();renderTr();}}
  catch(_){alert("הקובץ לא נראה כמו גיבוי של האפליקציה");}
  e.target.value="";
};

const openSes=new Set();

// the ladders a block uses today (a skill block offers a choice)
function blockLads(p,bi,S){
  const b=p.blocks[bi];
  if(b.alt){const ci=Math.min((S.alt||{})[p.id+":"+bi]||0,b.alt.length-1);return [[b.alt[ci][0],b.alt[ci][1]]];}
  return b.lad||[];
}
const trackable=b=>!b.dose&&!b.test&&!b.warm;
function rowsHtml(k,pres,S,b){
  const L=LAD(k);if(!L)return "";
  const rows=pres.map(tr=>{const i=lvIdx(tr,k);return {tr,i,j:subIdx(L.steps,i,S.avail)}}).sort((a,c)=>(a.i<0)-(c.i<0)||a.i-c.i);
  const need={};
  rows.forEach(r=>{if(r.j>=0)(fitAlt(L.steps[r.j],S.avail)||[]).forEach(t=>need[t]=(need[t]||0)+1);});
  const needTxt=Object.keys(need).map(t=>`${EQN[t]} ×${need[t]}`).join(" · ");
  return `<p class="eqsum">${needTxt?`ציוד: ${needTxt}`:"בלי ציוד"}</p>`+rows.map(({tr,i,j})=>{
    const dk=tr.id+"|"+k, done=!!S.done[dk], s=j>=0?L.steps[j]:null, st=(tr.streak||{})[k]||0;
    return `<div class="srow">
      <div class="sn"><b>${esc(tr.name)}</b>${tr.note?`<small>${esc(tr.note)}</small>`:""}</div>
      <select data-t="${tr.id}" data-k="${esc(k)}" aria-label="השלב של ${esc(tr.name)}">${stepOpts(L,i)}</select>
      ${i<0||b.test?"":j<0?`<p class="warn">אין ציוד מתאים לסולם הזה היום.</p>`
       :`${j!==i?`<p class="warn">אין ציוד ל־${esc(exName(L.steps[i]))}. היום: <b>${esc(exFull(s))}</b></p>`:""}
         <div class="sact"><span class="tg">${s.he?`<span class="hn">${esc(s.he)}</span>`:""}${b.dose?`היום: <b>${esc(b.dose)}</b>`:`יעד: <b>${esc(s.pass)}</b>${st?` <i class="st">(פעם 1 מתוך 2)</i>`:""}`}</span>
           ${trackable(b)&&j===i?`<button class="ok" data-ok="${esc(dk)}" aria-pressed="${done}">${done?"✓ עמד":"עמד?"}</button>`:""}
           <button class="mv" data-open="${esc(k)}" data-x="${j}" aria-label="איך עושים ${esc(exName(s))}">?</button></div>`}
    </div>`}).join("");
}
function renderSes(){
  const S=CO.ses;S.present=S.present.filter(id=>trById(id));S.alt=S.alt||{};
  if(!CO.trainees.length){
    $("sbody").innerHTML=`<p class="empty">כדי לבנות אימון צריך קודם להוסיף מתאמנים ולסמן לכל אחד את השלב שלו בכל סולם.</p><button class="primary" data-goto="tr">למסך המתאמנים</button>`;
    return;
  }
  const p=planById(S.plan);S.plan=p.id;
  const chip=(on,attrs,txt)=>`<button class="lad" aria-pressed="${on}" ${attrs}>${txt}</button>`;
  const missing=EQ.filter(e=>!S.avail.includes(e[0])).map(e=>e[1]);
  const groups=[...new Set(PLANS.map(x=>x.group))];
  let h=`<details class="opt plan" data-o="plan"${isOpen("plan",false)?" open":""}><summary>${esc(p.name)}<span>${p.min} דק׳ · החלפה</span></summary>
      ${groups.map(g=>`<p class="label">${g}</p><div class="plist">${PLANS.filter(x=>x.group===g).map(x=>`<button class="pl" data-plan="${x.id}" aria-pressed="${x.id===p.id}"><b>${esc(x.name)}<small>${x.min} דק׳</small></b><span>${esc(x.when)}</span></button>`).join("")}</div>`).join("")}
    </details>
    <p class="pwhen">${esc(p.when)}</p>
    <details class="opt" data-o="who"${isOpen("who",false)?" open":""}><summary>מי מגיע<span>${S.present.length===CO.trainees.length?`כולם (${S.present.length})`:`${S.present.length} מתוך ${CO.trainees.length}`}</span></summary>
      <div class="chips">${CO.trainees.map(t=>chip(S.present.includes(t.id),`data-p="${t.id}"`,esc(t.name))).join("")}</div></details>
    <details class="opt" data-o="eq"${isOpen("eq",false)?" open":""}><summary>ציוד במקום<span>${missing.length?`חסר: ${missing.join(", ")}`:"הכל זמין"}</span></summary>
      <div class="chips">${EQ.map(e=>chip(S.avail.includes(e[0]),`data-e="${e[0]}"`,e[1])).join("")}</div></details>
    <details class="opt" data-o="guide"${isOpen("guide",false)?" open":""}><summary>מדריך למאמן<span>איך מעבירים אימון קבוצתי</span></summary>
      <div class="guide">${GUIDE.map(g=>`<p><b>${g[0]}</b>${esc(g[1])}</p>`).join("")}</div></details>`;
  if(!S.present.length){
    h+=`<p class="empty">מסמנים מי מגיע היום ב"מי מגיע".</p>`;
    $("sbody").innerHTML=h;return;
  }
  const pres=S.present.map(trById);
  h+=`<div class="blks">`;
  let t0=0;
  const block=(id,title,meta,inner)=>`<details class="blk" data-o="${esc(id)}"${isOpen(id,false)?" open":""}>
      <summary><span class="bt">${title}</span><span class="bm">${meta}</span></summary>${inner}</details>`;
  const badges=(lads,b)=>{let ok=0,unset=0;
    lads.forEach(([,k])=>pres.forEach(tr=>{if(S.done[tr.id+"|"+k]&&trackable(b))ok++;if(lvIdx(tr,k)<0)unset++;}));
    return `${unset&&!b.test?`<i class="warn">${unset} בלי שלב</i>`:""}${ok?`<i>✓ ${ok}</i>`:""}`;};
  p.blocks.forEach((b,bi)=>{
    const lads=blockLads(p,bi,S), t1=t0+b.m;
    let inner=`<ul class="how">${b.how.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    if(b.alt) inner+=`<div class="chips alt">${b.alt.map((a,ci)=>chip(a[1]===lads[0][1],`data-alt="${bi}:${ci}"`,esc(a[0]))).join("")}</div>`;
    lads.forEach(([lab,k])=>{const L=LAD(k);if(!L)return;
      inner+=`<h4>${esc(lab)}${lab!==shortName(L)?` · ${esc(shortName(L))}`:""}</h4>`+rowsHtml(k,pres,S,b);});
    h+=block(`b:${p.id}:${bi}`,`<i class="tm">${t0}–${t1}</i>${esc(b.t)}`,lads.length?badges(lads,b):"",inner);
    t0=t1;
  });
  S.keys.forEach(k=>{const L=LAD(k);if(!L)return;const b={};
    h+=block(`x:${k}`,`<i class="tm">+</i>${esc(shortName(L))}`,badges([["",k]],b),rowsHtml(k,pres,S,b)+`<button class="rm" data-rm="${esc(k)}">הסרה מהאימון</button>`);});
  h+=`</div>`+addSel(S);
  const nDone=Object.keys(S.done).filter(x=>S.done[x]).length;
  h+=`<button class="primary" id="sfin">סיום אימון${nDone?` (${nDone} עמדו ביעד)`:""}</button>`;
  $("sbody").innerHTML=h;
}
function addSel(S){
  return `<select id="sadd" class="addex" aria-label="הוספת תרגיל לאימון"><option value="">+ הוספת תרגיל לאימון</option>${LADS.filter(L=>!S.keys.includes(L.key)).map(L=>`<option value="${esc(L.key)}">${esc(L.l)} (${esc(L.t)}${L.ci===1?", טבעות":""})</option>`).join("")}</select>`;
}
$("sbody").addEventListener("toggle",e=>{const d=e.target;if(!d.dataset||!d.dataset.o)return;
  const id=d.dataset.o;openSes.delete(id);openSes.delete("!"+id);openSes.add(d.open?id:"!"+id);},true);
$("sbody").onclick=e=>{
  const S=CO.ses,b=e.target.closest("button");if(!b)return;
  $("smsg").hidden=true;
  if(b.dataset.goto){show(b.dataset.goto);return;}
  if(b.dataset.p){const id=b.dataset.p;S.present=S.present.includes(id)?S.present.filter(x=>x!==id):[...S.present,id];}
  else if(b.dataset.e){const id=b.dataset.e;S.avail=S.avail.includes(id)?S.avail.filter(x=>x!==id):[...S.avail,id];}
  else if(b.dataset.plan){S.plan=b.dataset.plan;openSes.delete("plan");openSes.add("!plan");}
  else if(b.dataset.alt){const [bi,ci]=b.dataset.alt.split(":");S.alt=S.alt||{};S.alt[S.plan+":"+bi]=+ci;}
  else if(b.dataset.rm){S.keys=S.keys.filter(k=>k!==b.dataset.rm);}
  else if(b.dataset.ok){S.done[b.dataset.ok]=!S.done[b.dataset.ok];}
  else if(b.dataset.open){openStep(b.dataset.open,+b.dataset.x);return;}
  else if(b.id==="sfin"){finish();return;}
  else return;
  csave();const y=window.scrollY;renderSes();window.scrollTo(0,y);
};
$("sbody").onchange=e=>{
  const S=CO.ses,t=e.target;
  if(t.id==="sadd"){if(t.value){S.keys.push(t.value);openSes.add("x:"+t.value);csave();renderSes();}return;}
  if(t.dataset.t){const tr=trById(t.dataset.t),L=LAD(t.dataset.k);if(!tr||!L)return;tr.lv=tr.lv||{};
    tr.lv[t.dataset.k]=t.value===""?"":L.steps[+t.value].ex;delete S.done[tr.id+"|"+t.dataset.k];
    if(tr.streak) delete tr.streak[t.dataset.k];
    csave();const y=window.scrollY;renderSes();window.scrollTo(0,y);}
};
// progression: hitting the target in two sessions in a row moves a trainee up one step
function finish(){
  const S=CO.ses,p=planById(S.plan),ch=[],half=[];
  const keys=new Set(S.keys);
  p.blocks.forEach((b,bi)=>{if(trackable(b)) blockLads(p,bi,S).forEach(([,k])=>keys.add(k));});
  for(const id of S.present){
    const tr=trById(id);if(!tr)continue;tr.streak=tr.streak||{};
    for(const k of keys){
      const L=LAD(k),i=lvIdx(tr,k);if(!L||i<0)continue;
      if(!S.done[id+"|"+k]){delete tr.streak[k];continue;}
      const n=(tr.streak[k]||0)+1;
      if(n>=2&&i+1<L.steps.length){tr.lv[k]=L.steps[i+1].ex;delete tr.streak[k];ch.push({id,name:tr.name,k,from:L.steps[i].ex,to:L.steps[i+1].ex});}
      else{tr.streak[k]=Math.min(n,2);half.push({name:tr.name,k});}
    }
  }
  CO.log.push({d:new Date().toISOString(),n:S.present.length,plan:p.id,keys:[...keys],ch});
  if(CO.log.length>300) CO.log=CO.log.slice(-300);
  S.done={};csave();renderSes();
  const m=$("smsg");m.hidden=false;
  m.innerHTML=`<b>האימון נשמר.</b>`+
    (ch.length?`<p class="lbl">עלו שלב:</p>${ch.map(c=>`<p>${esc(c.name)}: ${esc(exByKey(c.k,c.to))}</p>`).join("")}`:"")+
    (half.length?`<p class="lbl">עמדו ביעד פעם ראשונה (עוד פעם אחת ועולים):</p>${half.map(c=>`<p>${esc(c.name)}: ${esc(shortName(LAD(c.k)))}</p>`).join("")}`:"")+
    (!ch.length&&!half.length?"<p>אף אחד לא סומן כעומד ביעד, אז הרמות נשארו כמו שהן.</p>":"");
  m.scrollIntoView({block:"center"});
}
let v0="lib";try{v0=localStorage.getItem("cal-view")||"lib"}catch(e){}
if(!["lib","tr","ses"].includes(v0)) v0="lib";
show(v0);
